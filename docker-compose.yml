services:
  mysql:
    image: mysql:8.0
    container_name: medical-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
      MYSQL_DATABASE: medical_platform
      MYSQL_USER: medical_app
      MYSQL_PASSWORD: "123456"
      TZ: Asia/Shanghai
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: medical-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  spark:
    image: apache/spark:4.0.1
    container_name: medical-spark
    restart: unless-stopped
    working_dir: /app
    command: ["/bin/bash", "-lc", "tail -f /dev/null"]
    ports:
      - "4040:4040"
    volumes:
      - ./data:/app/data
      - ./spark_jobs:/app/spark_jobs
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
  redis_data:
